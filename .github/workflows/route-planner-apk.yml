name: Route Planner APK

on:
  push:
    paths:
      - "RoutePlanner/**"
      - ".github/workflows/route-planner-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RoutePlanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        env:
          # Optional. Add a repository secret named MAPS_API_KEY to show the map.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RoutePlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoutePlanner-apk
          path: RoutePlanner/RoutePlanner.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: route-planner-build-${{ github.run_number }}
          name: Route Planner (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: RoutePlanner/RoutePlanner.apk
          body: |
            Android APK for Route Planner, built from ${{ github.ref_name }} @ ${{ github.sha }}.
            On your phone, download RoutePlanner.apk below and open it to install.
